name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint shell scripts
        run: shellcheck scripts/*.sh
      - name: Test
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Build container
        run: docker build --tag slab-agents:ci .
      - name: Smoke container
        env:
          SLAB_AGENTS_SMOKE_IMAGE: slab-agents:ci
        run: ./scripts/container-smoke.sh
